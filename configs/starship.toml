add_newline = true
command_timeout = 200

format = """
${custom.device}\
[](#cba6f7)$directory\
${custom.no_git_end}\
$git_branch\
$git_status\
${custom.git_end}
$character"""

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bg:#cba6f7 fg:#1e1e2e"
format = "[ $path ]($style)"
repo_root_style = "bold fg:#1e1e2e bg:#cba6f7"
repo_root_format = "[ $repo_root]($repo_root_style)[$path ]($style)"

[git_branch]
symbol = ""
style = "bg:#45475a fg:#cba6f7"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#45475a fg:#cba6f7"
format = "[($all_status$ahead_behind )]($style)"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[custom.git_end]
description = "End bubble for git"
command = "exit 0"
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = "[](#45475a)"

[custom.no_git_end]
description = "Single end bubble for non-git"
command = "exit 0"
when = "! git rev-parse --is-inside-work-tree 2>/dev/null"
format = "[](#cba6f7)"

[character]
error_symbol = "[✗](bold red) "
success_symbol = "[❯](bold #cba6f7) "

[custom.device]
description = "SSH device indicator"
command = 'echo "${HOSTNAME:-phone}"'
when = 'test -n "$SSH_TTY"'
format = "[](#45475a)[@$output](bg:#45475a fg:#cdd6f4)[](#45475a) "
